[project]
name = "trendpulse"
version = "0.1.0"
description = "Innovation Trend Intelligence System for Tyson Foods"
requires-python = ">=3.12"
dependencies = [
    "pytrends>=4.9",
    "praw>=7.7",
    "google-cloud-bigquery>=3.20",
    "anthropic>=0.49",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end integration tests (hit real BigQuery and LLM)",
    "unit: unit tests (no external deps)",
    "integration: integration tests",
    "slow: slow tests",
]
